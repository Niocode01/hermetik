[package]
name = "access"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
ic-cdk = "0.18"
icrc-ledger-types = "0.2"
num-traits = "0.2"
serde_bytes = "0.11"
sha2 = "0.10"
subtle = "2"

[features]
# Task 15: ruta tECDSA (diseño, no activa). El flujo HMAC sigue siendo
# el camino por defecto; este flag solo compila el esqueleto de diseño.
tecdsa = []

